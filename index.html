<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BilanRadarQC — Cellules de Voronoï des CINP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    header {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(255,255,255,.96); color: #222;
      padding: .5rem 1rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
      font-size: .82rem; text-align: center; max-width: 92vw;
    }
    header h1 { margin: 0; font-size: 1rem; }
    header p { margin: .15rem 0 0; color: #555; }
    .legend {
      position: absolute; bottom: 24px; right: 10px; z-index: 1000;
      background: rgba(255,255,255,.96); color: #222; padding: .5rem .75rem;
      border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: .8rem;
    }
    .legend div { display: flex; align-items: center; gap: .4rem; margin: .2rem 0; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .cellsw { width: 12px; height: 12px; border: 1px solid #333; display: inline-block; }
  </style>
</head>
<body>
  <header>
    <h1>BilanRadarQC — Cellules de Voronoï des cinémomètres fixes (CINP)</h1>
    <p id="stats">Chargement des sources officielles…</p>
  </header>
  <div id="map"></div>
  <div class="legend">
    <div><span class="cellsw" style="background:#1f77b4"></span> Cellule de Voronoï</div>
    <div><span class="swatch" style="background:#e31a1c"></span> Radar photo fixe</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    const WFS_URL = 'https://ws.mapserver.transports.gouv.qc.ca/swtq?service=wfs&request=getfeature&typename=ms:radars_photos&outputformat=geojson&version=2.0.0&srsname=EPSG:4326';
    const REGIONS_URL = 'https://servicescarto.mern.gouv.qc.ca/pes/rest/services/Territoire/SDA_WMS/MapServer/0/query?where=' +
      'RES_CO_REG%20IN%20(%2703%27%2C%2706%27%2C%2712%27%2C%2713%27%2C%2714%27%2C%2715%27%2C%2716%27)' +
      '&outFields=RES_CO_REG%2CRES_NM_REG&returnGeometry=true&f=geojson&outSR=4326';
    const REG_CODE = {
      'Capitale-Nationale': '03', 'Montréal': '06', 'Chaudière-Appalaches': '12',
      'Laval': '13', 'Lanaudière': '14', 'Laurentides': '15', 'Montérégie': '16',
    };

    const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ');

    async function loadRadars() {
      const fc = await (await fetch(WFS_URL)).json();
      return fc.features.filter(f => f.properties.typeAppareil === 'Radar photo fixe'
        && !norm(f.properties.description).includes('a l intersection'));
    }

    async function loadRegions() {
      const fc = await (await fetch(REGIONS_URL)).json();
      return fc.features.map(f => ({
        code: f.properties.RES_CO_REG,
        nom: f.properties.RES_NM_REG,
        ring: f.geometry.coordinates[0], // [lon,lat], un seul ring (pas de trous)
      }));
    }

    // ---------- découpage Voronoï (médiatrice) ----------
    const M_PER_DEG = 111320;
    function regionCosLat(ring) {
      let lat = 0;
      for (const [, y] of ring) lat += y;
      return Math.cos((lat / ring.length) * Math.PI / 180) || 1e-9;
    }
    const proj = (lon, lat, c) => [lon * M_PER_DEG * c, lat * M_PER_DEG];
    const unproj = (x, y, c) => [x / (M_PER_DEG * c), y / M_PER_DEG];

    // découpe un ring par la médiatrice de A-B → [cellule A, cellule B] (rings, ou null)
    function cutRegion(ring, A, B, cosLat) {
      const a = proj(A[0], A[1], cosLat), b = proj(B[0], B[1], cosLat);
      const M = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const d = [b[0] - a[0], b[1] - a[1]];
      const side = p => (p[0] - M[0]) * d[0] + (p[1] - M[1]) * d[1];
      const pr = ring.map(([lon, lat]) => proj(lon, lat, cosLat));
      const pos = [], neg = []; // pos = côté de B, neg = côté de A
      for (let i = 0; i < pr.length - 1; i++) {
        const p1 = pr[i], p2 = pr[i + 1];
        const s1 = side(p1), s2 = side(p2);
        if (s1 >= 0) pos.push(p1); else neg.push(p1);
        if ((s1 >= 0) !== (s2 >= 0)) {
          const t = s1 / (s1 - s2);
          const ip = [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])];
          pos.push(ip); neg.push(ip);
        }
      }
      const close = r => { const q = r.slice(); if (q.length && (q[0][0] !== q[q.length - 1][0] || q[0][1] !== q[q.length - 1][1])) q.push(q[0]); return q; };
      const cells = [null, null];
      // neg = côté de A, pos = côté de B
      if (neg.length) cells[0] = close(neg).map(([x, y]) => unproj(x, y, cosLat));
      if (pos.length) cells[1] = close(pos).map(([x, y]) => unproj(x, y, cosLat));
      return cells;
    }

    // aire d'un ring en km² (shoelace sur projection locale)
    function ringAreaKm2(ring, cosLat) {
      let s = 0;
      for (let i = 0; i < ring.length - 1; i++) {
        const [x1, y1] = proj(ring[i][0], ring[i][1], cosLat);
        const [x2, y2] = proj(ring[i + 1][0], ring[i + 1][1], cosLat);
        s += x1 * y2 - x2 * y1;
      }
      return Math.abs(s) / 2 / 1e6;
    }

    // ---------- carte ----------
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const COLORS = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'];
    const fmt = n => Math.round(n).toLocaleString('fr-CA');
    const fmtDate = iso => (iso || '').slice(0, 10) || '—';

    Promise.all([loadRadars(), loadRegions()]).then(([radars, regions]) => {
      const regionByCode = Object.fromEntries(regions.map(r => [r.code, r]));
      const radarsByRegion = {}; // code -> [features]
      for (const f of radars) {
        const code = REG_CODE[f.properties.region];
        (radarsByRegion[code] = radarsByRegion[code] || []).push(f);
      }
      const cells = []; // {ring, props}
      const pts = [];
      for (const code of Object.keys(radarsByRegion).sort()) {
        const reg = regionByCode[code];
        if (!reg) continue;
        const rl = radarsByRegion[code];
        const cosLat = regionCosLat(reg.ring);
        const areaRegion = ringAreaKm2(reg.ring, cosLat);
        const rings = [];
        if (rl.length === 1) {
          rings.push({ radar: rl[0], ring: reg.ring });
        } else {
          // partition de Voronoï : chaque paire de radars se partage la région
          const A = rl[0].geometry.coordinates, B = rl[1].geometry.coordinates;
          const [cellA, cellB] = cutRegion(reg.ring, A, B, cosLat);
          if (cellA) rings.push({ radar: rl[0], ring: cellA });
          else console.warn('cellule A vide pour', reg.nom);
          if (cellB) rings.push({ radar: rl[1], ring: cellB });
          else console.warn('cellule B vide pour', reg.nom);
        }
        for (const { radar: r, ring } of rings) {
          const idSite = (r.properties.urlImage.match(/idSite=(\d+)/) || [])[1] || '?';
          const area = ringAreaKm2(ring, cosLat);
          cells.push({
            ring, props: {
              idSite, region: reg.nom, municipalite: r.properties.municipalite,
              description: r.properties.description,
              superficie_km2: area, pct_region: area / areaRegion * 100,
            }
          });
          pts.push([r.geometry.coordinates[1], r.geometry.coordinates[0]]);
        }
      }

      cells.forEach((c, i) => {
        // Leaflet attend [lat, lon] — les rings (GeoJSON ESRI) sont en [lon, lat]
        L.polygon(c.ring.map(([lon, lat]) => [lat, lon]), {
          color: '#333', weight: 1.2, fillColor: COLORS[i % COLORS.length], fillOpacity: .45
        }).bindPopup(`
          <div style="font-size:.82rem; line-height:1.35; max-width:320px;">
            <strong>${c.props.description}</strong>
            <div style="margin-top:.3rem"><strong>Région :</strong> ${c.props.region}</div>
            <div><strong>Cellule (idSite ${c.props.idSite}) :</strong> ${fmt(c.props.superficie_km2)} km²
              <span style="color:#777">(${c.props.pct_region.toFixed(1)} % de la région)</span></div>
          </div>`).addTo(map);
      });

      radars.forEach(f => {
        const p = f.properties;
        const idSite = (p.urlImage.match(/idSite=(\d+)/) || [])[1] || '?';
        const latlng = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
        L.circleMarker(latlng, {
          radius: 7, color: '#000', weight: 1.2, fillColor: '#e31a1c', fillOpacity: 1
        }).bindPopup(`
          <div style="font-size:.82rem; line-height:1.35; max-width:320px;">
            <strong>${p.description}</strong>
            <div style="margin-top:.3rem"><strong>Région / Municipalité (MTMD) :</strong> ${p.region} / ${p.municipalite}</div>
            <div><strong>Type :</strong> ${p.typeAppareil} <span style="color:#777">(idSite ${idSite})</span></div>
            <div><strong>En service depuis :</strong> ${fmtDate(p.dateDebutService)}</div>
          </div>`).addTo(map);
        pts.push(latlng);
      });

      document.getElementById('stats').textContent =
        `${cells.length} cellules de Voronoï — ${radars.length} radars photo fixes (MTMD) — régions : MRN (Découpages administratifs)`;

      if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.05));
      else map.setView([46.5, -72.0], 6);
    }).catch(err => {
      document.getElementById('stats').textContent = 'Erreur de chargement : ' + err.message;
      map.setView([46.5, -72.0], 6);
    });
  </script>
</body>
</html>
