<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BilanRadarQC — Carte des CINP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    header {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(255,255,255,.96); color: #222;
      padding: .5rem 1rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
      font-size: .82rem; text-align: center; max-width: 92vw;
    }
    header h1 { margin: 0; font-size: 1rem; }
    header p { margin: .15rem 0 0; color: #555; }
    .legend {
      position: absolute; bottom: 24px; right: 10px; z-index: 1000;
      background: rgba(255,255,255,.96); color: #222; padding: .5rem .75rem;
      border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: .8rem;
    }
    .legend div { display: flex; align-items: center; gap: .4rem; margin: .2rem 0; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <header>
    <h1>BilanRadarQC — Cinémomètres fixes (CINP)</h1>
    <p id="stats">Chargement de la source officielle (MTMD)…</p>
  </header>
  <div id="map"></div>
  <div class="legend">
    <div><span class="swatch" style="background:#1f77b4"></span> Radar photo fixe</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    const WFS_URL = 'https://ws.mapserver.transports.gouv.qc.ca/swtq?service=wfs&request=getfeature&typename=ms:radars_photos&outputformat=geojson&version=2.0.0&srsname=EPSG:4326';

    const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ');

    async function loadRadars() {
      const fc = await (await fetch(WFS_URL)).json();
      return fc.features.filter(f => f.properties.typeAppareil === 'Radar photo fixe');
    }

    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const fmtDate = iso => (iso || '').slice(0, 10) || '—';

    loadRadars().then(radars => {
      const pts = [];
      let n = 0;
      for (const f of radars) {
        const p = f.properties;
        // Hors périmètre : fixe pur situé À une intersection (ex. Saint-Georges,
        // boul. Lacroix / 114e Rue) — accidentogène par nature, exclu.
        if (norm(p.description).includes('a l intersection')) continue;
        n++;
        const id = (p.urlImage.match(/idSite=(\d+)/) || [])[1] || '?';
        const latlng = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
        const mk = L.circleMarker(latlng, {
          radius: 10, color: '#fff', weight: 1.5,
          fillColor: '#1f77b4', fillOpacity: .85
        });
        mk.bindPopup(`
          <div style="font-size:.82rem; line-height:1.35; max-width:320px;">
            <strong>${p.description}</strong>
            <div style="margin-top:.3rem"><strong>Région / Municipalité (MTMD) :</strong> ${p.region} / ${p.municipalite}</div>
            <div><strong>Type :</strong> ${p.typeAppareil} <span style="color:#777">(idSite ${id})</span></div>
            <div><strong>En service depuis :</strong> ${fmtDate(p.dateDebutService)}</div>
          </div>`);
        mk.addTo(map);
        pts.push(latlng);
      }
      document.getElementById('stats').textContent =
        `${n} radars photo fixes en service (hors intersections) — Source : MTMD (WFS)`;
      if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.2));
      else map.setView([46.5, -72.0], 6);
    }).catch(err => {
      document.getElementById('stats').textContent = 'Erreur de chargement : ' + err.message;
      map.setView([46.5, -72.0], 6);
    });
  </script>
</body>
</html>
